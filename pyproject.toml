[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scnet-infer"
dynamic = ["version"]
description = "Inference-only SCNet music source separation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Weinan Tong" },
  { name = "Jiaxu Zhu" },
  { name = "Jun Chen" },
  { name = "Shiyin Kang" },
  { name = "Tao Jiang" },
  { name = "Yang Li" },
  { name = "Zhiyong Wu" },
  { name = "Helen Meng" },
  { name = "Roman Solovyev" },
]
maintainers = [
  { name = "Paul Yu", email = "bernie40916@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "einops>=0.7",
  "numpy>=1.24",
  "packaging>=23.0",
  "rotary-embedding-torch>=0.8",
  "soundfile>=0.12",
  "torch>=2.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "ml-collections>=0.1",
  "pytest>=8.0",
  "ruff>=0.5",
  "tqdm>=4.66",
]
[project.scripts]
scnet-infer = "scnet_infer.cli:main"

[project.urls]
Source = "https://github.com/ChenPaulYu/scnet-infer"
Upstream = "https://github.com/starrytong/SCNet"

[tool.hatch.version]
path = "src/scnet_infer/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scnet_infer"]

[tool.hatch.build.targets.wheel.force-include]
"src/scnet_infer/config/checkpoints.toml" = "scnet_infer/config/checkpoints.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "realweights: needs a real checkpoint already on disk and specific hardware (deselected by default, run with -m realweights)",
]
addopts = "-m 'not realweights'"
