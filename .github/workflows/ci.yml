name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # --extra dev only, not --all-extras: the mlx extra is Apple-Silicon-only
      # (no Linux wheels) and this matrix runs on ubuntu-latest. MLX-marked
      # tests are `realweights`-gated and deselected by default regardless.
      - run: uv sync --extra dev
      - run: uv run pytest -q
